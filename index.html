<!DOCTYPE html>
<html>
<head>
    <title>Laptops</title>

    <style>
        table, tr, td {
            border: 1px solid black;
        }
    </style>

</head>
	<body>
	<h1>Comparing Laptops</h1>
		<table border="1">
		<caption>Features and Prices</caption>
			<tr>
				<th>Model</th>
				<th>Price</th>
				<th>Battery Life</th>
				<th>Storage</th>
			</tr>
			
			<tr>
				<td>Model A</td>
				<td>$500</td>
				<td>8 hours</td>
				<td>256 GB</td>
			</tr>
			
			<tr>
				<td>Model B</td>
				<td>$650</td>
				<td>10 hours</td>
				<td>512 GB</td>
			</tr>
			
			<tr>
				<td>Model C</td>
				<td>$750</td>
				<td>12 hours</td>
				<td>1 TB</td>
			</tr>
			
			
			
		</table>
			<h2>Conclusions</h2>
		<ul>
			<li>Model A is the cheapest</li>
			<li>Model C has the longest battery life</li>
			<li>Model C has the most storage</li>
		</ul>
	</body>
</html>
